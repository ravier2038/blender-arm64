name: Blender Linux arm64 (Nix)

on:
  workflow_dispatch:
    inputs:
      native:
        description: "Build natively on an arm64 runner instead of cross compiling"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ${{ inputs.native && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          df -h

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = auto

      # Optional: persist build results between runs.
      # Create a cache at cachix.org, then add CACHIX_AUTH_TOKEN as a repo secret
      # and replace "your-cache-name".
      # - uses: cachix/cachix-action@v15
      #   with:
      #     name: your-cache-name
      #     authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build Blender
        run: nix build .#default -L --out-link result

      - name: Export closure
        run: |
          nix-store --export $(nix-store -qR result) | xz -T0 > blender-aarch64-closure.nar.xz
          readlink -f result > store-path.txt

      - uses: actions/upload-artifact@v4
        with:
          name: blender-linux-arm64
          path: |
            blender-aarch64-closure.nar.xz
            store-path.txt
          if-no-files-found: error
